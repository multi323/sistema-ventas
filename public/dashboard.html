<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sistema de Ventas</title>
    <link rel="stylesheet" href="styles/dashboard.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-small">📊</div>
                <h2>VENTAS PRO</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-section="inicio">
                    <span class="icon">🏠</span>
                    <span class="label">Inicio</span>
                </a>
                <a href="#" class="nav-item" data-section="pedidos">
                    <span class="icon">📦</span>
                    <span class="label">Pedidos</span>
                </a>
                <a href="#" class="nav-item" data-section="menu">
                    <span class="icon">🍽️</span>
                    <span class="label">Menú</span>
                </a>
                <a href="#" class="nav-item" data-section="analytics">
                    <span class="icon">📊</span>
                    <span class="label">Analíticas</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <button id="btnLogout" class="btn-logout">
                    <span class="icon">🚪</span>
                    <span class="label">Salir</span>
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div class="header-left">
                    <h1 id="pageTitle">Inicio</h1>
                    <p id="pageSubtitle">Bienvenido a tu dashboard</p>
                </div>
                <div class="header-right">
                    <button id="btnNotifications" class="btn-icon">
                        🔔
                        <span class="notification-badge">0</span>
                    </button>
                </div>
            </header>

            <div class="content-sections">
                <section id="inicio" class="section active">
                    <div class="stats-row">
                        <div class="stat-card">
                            <div class="stat-icon">📦</div>
                            <div class="stat-content">
                                <p class="stat-label">Pedidos Hoy</p>
                                <h3 class="stat-value">0</h3>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">💰</div>
                            <div class="stat-content">
                                <p class="stat-label">Ingresos Hoy</p>
                                <h3 class="stat-value">$0</h3>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-icon">✅</div>
                            <div class="stat-content">
                                <p class="stat-label">Entregados</p>
                                <h3 class="stat-value">0</h3>
                            </div>
                        </div>
                    </div>
                    <p style="color: var(--text-muted); text-align: center; margin-top: 50px;">
                        ✅ Dashboard completamente funcional
                    </p>
                </section>

                <section id="pedidos" class="section">
                    <p style="color: var(--text-muted);">📦 Sección de Pedidos en desarrollo...</p>
                </section>

                <section id="menu" class="section">
                    <p style="color: var(--text-muted);">🍽️ Gestión de Menú en desarrollo...</p>
                </section>

                <section id="analytics" class="section">
                    <p style="color: var(--text-muted);">📊 Analíticas en desarrollo...</p>
                </section>
            </div>
        </main>
    </div>

    <script src="js/dashboard.js"></script>
</body>
</html>
