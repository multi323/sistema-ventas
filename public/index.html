<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tilio - Login</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <!-- Logo -->
            <div class="logo-section">
                <h1 class="logo">T</h1>
                <h2>TILIO</h2>
                <p>Sistema de Ventas Profesional</p>
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab-btn active" data-tab="login">Iniciar Sesión</button>
                <button class="tab-btn" data-tab="register">Registrarse</button>
            </div>

            <!-- LOGIN TAB -->
            <form id="loginForm" class="form-section active">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="tu@email.com" required>
                </div>

                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>

                <div class="checkbox-group">
                    <label class="checkbox">
                        <input type="checkbox" id="rememberPassword">
                        <span>Recordar contraseña</span>
                    </label>
                    <label class="checkbox">
                        <input type="checkbox" id="rememberEmail">
                        <span>Recordar cuenta</span>
                    </label>
                </div>

                <button type="submit" class="btn-neon">🔓 ACCEDER</button>
            </form>

            <!-- REGISTER TAB -->
            <form id="registerForm" class="form-section">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="registerEmail" placeholder="tu@email.com" required>
                </div>

                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="registerPassword" placeholder="••••••••" required>
                </div>

                <div class="form-group">
                    <label>Nombre del Negocio</label>
                    <input type="text" id="businessName" placeholder="Mi Restaurante" required>
                </div>

                <button type="submit" class="btn-neon">✨ REGISTRARSE</button>

                <div class="divider">O REGÍSTRATE CON</div>

                <button type="button" class="btn-google">
                    <span>🔐</span> Google
                </button>
            </form>

            <!-- Error message -->
            <div id="errorMessage" class="error-message"></div>
        </div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
