<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TILIO - Sistema de Ventas</title>
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/variables.css">
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-box">
      <div class="login-header">
        <h1 class="neon-title">⚡ TILIO</h1>
        <p class="subtitle">Sistema de Ventas Profesional</p>
      </div>

      <div id="authForm" class="auth-form">
        <!-- LOGIN -->
        <div id="loginSection" class="form-section active">
          <h2>Iniciar Sesión</h2>
          <form id="loginForm">
            <div class="form-group">
              <label>📧 Correo Electrónico</label>
              <input type="email" id="loginEmail" placeholder="tu@email.com" required>
            </div>
            <div class="form-group">
              <label>🔐 Contraseña</label>
              <input type="password" id="loginPassword" placeholder="Contraseña" required>
            </div>
            <div class="checkbox-group">
              <input type="checkbox" id="rememberMe">
              <label for="rememberMe">Recordar contraseña y cuenta</label>
            </div>
            <button type="submit" class="btn-neon">🚀 ACCEDER</button>
          </form>
          <p class="toggle-text">¿No tienes cuenta? <a href="#" onclick="toggleAuth()">Regístrate aquí</a></p>
        </div>

        <!-- REGISTRO -->
        <div id="registerSection" class="form-section">
          <h2>Crear Cuenta</h2>
          <form id="registerForm">
            <div class="form-group">
              <label>🏪 Nombre del Negocio</label>
              <input type="text" id="businessName" placeholder="Mi Negocio" required>
            </div>
            <div class="form-group">
              <label>📧 Correo Electrónico</label>
              <input type="email" id="registerEmail" placeholder="tu@email.com" required>
            </div>
            <div class="form-group">
              <label>🔐 Contraseña</label>
              <input type="password" id="registerPassword" placeholder="Mínimo 6 caracteres" required>
            </div>
            <div class="form-group">
              <label>🔐 Confirmar Contraseña</label>
              <input type="password" id="confirmPassword" placeholder="Confirma tu contraseña" required>
            </div>
            <button type="submit" class="btn-neon">✨ REGISTRARSE</button>
            <button type="button" class="btn-google" onclick="loginWithGoogle()">
              🔵 Registrarse con Google
            </button>
          </form>
          <p class="toggle-text">¿Ya tienes cuenta? <a href="#" onclick="toggleAuth()">Inicia sesión</a></p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
